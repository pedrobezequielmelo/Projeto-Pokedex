<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./favicons/favicon-16x16.png">
    <link rel="stylesheet" href="./css/style.css">

    <title>Pokedex</title>
</head>
<body>

<main>

    <h1 class="pokemon_data">
        <span class="pokemon_number">6</span> -
        <span class="pokemon_name">bulbasaur</span>
    </h1>

    <img src="./imgs/bulbasaur.png" alt="pokemon" class="pokemon_img">

    <form class="form">

        <input
        type="search"
        class="input_search"
        placeholder="Name or Number"
        required
        >

        <button class="pesquisa">pesquisar</button>

    </form>


    <img src="./imgs/pokedex.png" alt="pokedex" class="pokedex">

    <div class="pokemon_info_box">

        <h2>Informações do Pokémon</h2>

        <p><strong>Nome:</strong> <span id="info_name">Bulbasaur</span></p>

        <p><strong>Número:</strong> <span id="info_number">#006</span></p>

        <p><strong>Tipo:</strong> <span id="info_type">Grass / Poison</span></p>

        <p><strong>Altura:</strong> <span id="info_height">0.7 m</span></p>

        <p><strong>Peso:</strong> <span id="info_weight">6.9 kg</span></p>

    </div>

</main>

<script src="./js/script.js"></script>

</body>
</html>
